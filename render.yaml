services:
  - type: web
    name: fiesta-fresh-bot
    env: docker
    dockerfilePath: ./bot/Dockerfile
    dockerContext: ./bot
    plan: free
    autoDeploy: true
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: FB_EMAIL
        sync: false
      - key: FB_PASSWORD
        sync: false
      - key: PROXY_SERVER
        sync: false
      - key: PROXY_USERNAME
        sync: false
      - key: PROXY_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DRY_RUN
        value: false
      - key: SCAN_INTERVAL_SECONDS
        value: 60
      - key: PORT
        value: 8080
